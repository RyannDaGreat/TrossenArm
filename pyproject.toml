[project]
name = "trossen-gripper-scratchpad"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "einx>=0.3,<0.4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pillow",
    "imageio-ffmpeg==0.7.0",
    "opencv-python-headless",
    "cv2-enumerate-cameras; sys_platform == 'darwin'",
    "pyrealsense2==2.59.1.11053; sys_platform != 'darwin'",
]

[project.optional-dependencies]
robot = ["trossen-arm==1.8.8"]

[dependency-groups]
dev = ["httpx>=0.28,<1"]

[tool.uv]
package = false
cache-dir = "agents/.scratchpad/uv-cache"
